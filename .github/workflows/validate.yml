name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Valider la structure des skills
        run: python scripts/validate_structure.py --strict

  plugin:
    # Le schéma complet de la place de marché et du plugin, tel que Claude Code
    # le lit. Le validateur Python ne contrôle que leur cohérence entre eux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Installer Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Valider la place de marché et le plugin
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/career-skills --strict
